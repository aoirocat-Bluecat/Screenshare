<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DirectDrop - 画面共有 & ファイル共有</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons for modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- PeerJS for WebRTC P2P networking -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120; /* Tailwind slate-950 */
            color: #f8fafc;
        }
        
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Smooth Screen Transitions */
        .app-screen { 
            display: none; 
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .app-screen.active { 
            display: flex; 
            opacity: 1; 
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .drag-over {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
        }

        #remote-video {
            background-color: #000;
            border-radius: 1rem;
            max-height: 60vh;
            object-fit: contain;
            display: none; /* Hidden until stream starts */
        }
        #remote-video.active {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- 背景エフェクト -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- ヘッダー -->
    <header class="w-full p-4 sm:p-6 flex items-center justify-between z-10 border-b border-slate-800/50 bg-slate-950/80 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="ph-bold ph-paper-plane-tilt text-white text-xl"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">DirectDrop</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="connection-indicator" class="flex items-center text-xs font-medium px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400 transition-colors duration-300">
                <span class="w-2 h-2 rounded-full bg-slate-500 mr-2 indicator-dot"></span>
                <span class="indicator-text">未接続</span>
            </span>
            <button id="btn-disconnect" onclick="disconnectPeer()" class="hidden px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-lg text-xs font-medium transition-all items-center space-x-1">
                <i class="ph ph-power"></i> <span>切断</span>
            </button>
        </div>
    </header>

    <!-- トースト通知 -->
    <div id="alert-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 px-6 py-3 rounded-2xl shadow-2xl backdrop-blur-lg border font-medium text-sm">
        <i id="alert-icon" class="text-xl"></i>
        <span id="alert-message"></span>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 w-full max-w-6xl mx-auto z-10 relative">

        <!-- 画面1: ロード中 -->
        <div id="screen-loading" class="app-screen active flex-col items-center text-center w-full max-w-md">
            <i class="ph ph-spinner-gap text-5xl text-blue-500 animate-spin mb-6"></i>
            <h2 class="text-xl font-bold mb-2">P2Pネットワークに接続中...</h2>
            <p class="text-slate-400 text-sm">初期化しています。少々お待ちください。</p>
        </div>

        <!-- 画面2: 接続セットアップ -->
        <div id="screen-setup" class="app-screen flex-col w-full max-w-lg">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold mb-2">安全なP2P通信</h2>
                <p class="text-slate-400 text-sm">サーバーを経由しない直接通信。画質劣化なしのファイル転送と画面共有が可能です。</p>
            </div>

            <div class="bg-slate-900/80 backdrop-blur-sm p-6 rounded-3xl border border-slate-800 shadow-xl space-y-6">
                <!-- 自分のID -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">あなたの接続ID</label>
                    <div class="flex items-center relative group">
                        <input type="text" id="my-peer-id" readonly class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl py-3 pl-4 pr-12 font-mono text-center focus:outline-none focus:border-blue-500 cursor-pointer" onclick="copyMyId()">
                        <button onclick="copyMyId()" class="absolute right-2 p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors group-hover:text-blue-400">
                            <i class="ph ph-copy text-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-center space-x-4">
                    <div class="h-px bg-slate-800 flex-grow"></div>
                    <span class="text-xs font-bold text-slate-500 uppercase">接続する</span>
                    <div class="h-px bg-slate-800 flex-grow"></div>
                </div>

                <!-- 相手のID入力 -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">相手のIDを入力</label>
                    <div class="flex space-x-2">
                        <input type="text" id="target-id" placeholder="相手のIDをペースト" class="flex-grow bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3 font-mono focus:outline-none focus:border-purple-500 placeholder:font-sans placeholder:text-slate-600">
                        <button onclick="connectToPeer()" id="btn-connect" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-3 rounded-xl transition-all shadow-lg active:scale-95 flex items-center space-x-2 whitespace-nowrap">
                            <i class="ph ph-link text-lg"></i> <span>接続</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 画面3: 通信中 (ファイル & 画面共有) -->
        <div id="screen-session" class="app-screen flex-col lg:flex-row w-full gap-6 items-start">
            
            <!-- 左カラム：画面共有 -->
            <div class="w-full lg:w-7/12 flex flex-col gap-4">
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-sm backdrop-blur-sm flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-bold text-slate-200 flex items-center">
                            <i class="ph ph-desktop mr-2 text-lg text-blue-400"></i> 画面共有
                        </h3>
                        <button id="btn-share-screen" onclick="toggleScreenShare()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition-all flex items-center space-x-2">
                            <i class="ph ph-screencast"></i> <span>画面を共有する</span>
                        </button>
                    </div>
                    
                    <!-- ビデオ表示エリア -->
                    <div id="video-container" class="w-full bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-center overflow-hidden min-h-[250px] relative">
                        <i id="video-placeholder" class="ph ph-monitor text-5xl text-slate-700"></i>
                        <video id="remote-video" autoplay playsinline class="w-full h-full"></video>
                        <div id="local-share-indicator" class="hidden absolute inset-0 bg-blue-900/20 backdrop-blur-sm flex flex-col items-center justify-center border-2 border-blue-500 rounded-xl">
                            <i class="ph-fill ph-screencast text-4xl text-blue-400 mb-2 animate-pulse"></i>
                            <p class="text-blue-100 font-medium">自分の画面を相手に共有中です</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右カラム：ファイル転送 -->
            <div class="w-full lg:w-5/12 flex flex-col gap-4">
                
                <!-- ドラッグ＆ドロップゾーン -->
                <div id="drop-zone" class="w-full border-2 border-dashed border-slate-700 bg-slate-900/50 hover:bg-slate-800/80 hover:border-blue-500/50 transition-all duration-200 rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group">
                    <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center text-blue-400 mb-4 group-hover:scale-110 transition-transform duration-300 shadow-xl border border-slate-700">
                        <i class="ph-bold ph-upload-simple text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-200 mb-1">ファイルを送信</h3>
                    <p class="text-slate-400 text-xs">クリックして選択、またはドロップ</p>
                    <input type="file" id="file-input" class="hidden" multiple>
                </div>

                <!-- ファイル転送リスト（リクエスト＆履歴） -->
                <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex-grow min-h-[300px]">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">転送リスト</h3>
                    
                    <div id="transfer-list" class="space-y-3">
                        <!-- アイテムがここに追加されます -->
                    </div>
                    
                    <div id="empty-history" class="text-center py-10 text-slate-600">
                        <i class="ph ph-tray text-3xl mb-2 opacity-50"></i>
                        <p class="text-xs font-medium">ファイル履歴はありません</p>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script>
        let peer = null;
        let conn = null; // Data channel connection
        let myId = null;
        let localStream = null;
        let mediaCall = null; // Media connection for screen share
        
        const CHUNK_SIZE = 64 * 1024; // 64KB
        const MAX_BUFFER = 5 * 1024 * 1024; // 5MB limit for backpressure

        // State maps
        const pendingOutboundFiles = {}; // files sender wants to send { fileId: File }
        const activeInboundFiles = {};   // files receiver is receiving { fileId: { buffers, size, received } }

        const dom = {
            screens: {
                loading: document.getElementById('screen-loading'),
                setup: document.getElementById('screen-setup'),
                session: document.getElementById('screen-session')
            },
            indicator: document.getElementById('connection-indicator'),
            indicatorDot: document.querySelector('.indicator-dot'),
            indicatorText: document.querySelector('.indicator-text'),
            btnDisconnect: document.getElementById('btn-disconnect'),
            myIdInput: document.getElementById('my-peer-id'),
            targetIdInput: document.getElementById('target-id'),
            dropZone: document.getElementById('drop-zone'),
            fileInput: document.getElementById('file-input'),
            transferList: document.getElementById('transfer-list'),
            emptyHistory: document.getElementById('empty-history'),
            remoteVideo: document.getElementById('remote-video'),
            videoPlaceholder: document.getElementById('video-placeholder'),
            btnShareScreen: document.getElementById('btn-share-screen'),
            localShareIndicator: document.getElementById('local-share-indicator')
        };

        function switchScreen(screenName) {
            Object.values(dom.screens).forEach(s => s.classList.remove('active'));
            dom.screens[screenName].classList.add('active');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('alert-toast');
            const icon = document.getElementById('alert-icon');
            const msg = document.getElementById('alert-message');
            
            toast.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 px-6 py-3 rounded-2xl shadow-2xl backdrop-blur-md border font-medium text-sm';
            msg.textContent = message;

            if (type === 'error') {
                toast.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-400');
                icon.className = 'ph-fill ph-warning-circle text-xl';
            } else if (type === 'success') {
                toast.classList.add('bg-green-500/10', 'border-green-500/20', 'text-green-400');
                icon.className = 'ph-fill ph-check-circle text-xl';
            } else {
                toast.classList.add('bg-blue-500/10', 'border-blue-500/20', 'text-blue-400');
                icon.className = 'ph-fill ph-info text-xl';
            }

            toast.classList.remove('opacity-0', '-translate-y-24');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-24');
            }, 4000);
        }

        function initPeer() {
            try {
                peer = new Peer({
                    debug: 2,
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    myId = id;
                    dom.myIdInput.value = myId;
                    switchScreen('setup');
                });

                // 受信側：データ接続
                peer.on('connection', (connection) => {
                    if (conn && conn.open) { connection.close(); return; }
                    setupConnection(connection);
                });

                // 受信側：メディア接続（画面共有）
                peer.on('call', (call) => {
                    // 自動応答
                    call.answer();
                    setupMediaCall(call);
                });

                peer.on('error', (err) => {
                    console.error("PeerJS Error:", err);
                    showToast(`エラー: ${err.type}`, 'error');
                });

            } catch (error) {
                console.error("Init error:", error);
                showToast("初期化に失敗しました", 'error');
            }
        }

        window.copyMyId = () => {
            if(!myId) return;
            dom.myIdInput.select();
            document.execCommand('copy');
            showToast("IDをコピーしました", 'success');
        };

        window.connectToPeer = () => {
            const targetId = dom.targetIdInput.value.trim();
            if (!targetId || targetId === myId) return showToast("有効な相手のIDを入力してください", 'error');

            const btn = document.getElementById('btn-connect');
            btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> <span>接続中</span>';
            btn.disabled = true;

            const connection = peer.connect(targetId, { reliable: true });
            setupConnection(connection);
        };

        function setupConnection(connection) {
            conn = connection;

            conn.on('open', () => {
                showToast("接続が確立されました！", 'success');
                switchScreen('session');
                
                dom.indicator.className = 'flex items-center text-xs font-medium px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/20 text-green-400';
                dom.indicatorDot.className = 'w-2 h-2 rounded-full bg-green-500 mr-2 shadow-[0_0_5px_#22c55e]';
                dom.indicatorText.textContent = `相手: ${conn.peer}`;
                dom.btnDisconnect.classList.remove('hidden');
                dom.btnDisconnect.classList.add('flex');
                
                const btn = document.getElementById('btn-connect');
                if(btn) {
                    btn.innerHTML = '<i class="ph ph-link"></i> <span>接続</span>';
                    btn.disabled = false;
                    dom.targetIdInput.value = '';
                }
            });

            conn.on('data', handleIncomingData);

            conn.on('close', () => {
                showToast("相手との通信が切断されました", 'error');
                handleDisconnect();
            });
            conn.on('error', () => { handleDisconnect(); });
        }

        window.disconnectPeer = () => {
            if (conn) conn.close();
            if (mediaCall) mediaCall.close();
            handleDisconnect();
        };

        function handleDisconnect() {
            conn = null;
            if(localStream) stopLocalStream();
            
            dom.indicator.className = 'flex items-center text-xs font-medium px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400';
            dom.indicatorDot.className = 'w-2 h-2 rounded-full bg-slate-500 mr-2';
            dom.indicatorText.textContent = '未接続';
            dom.btnDisconnect.classList.add('hidden');
            dom.btnDisconnect.classList.remove('flex');
            
            dom.remoteVideo.srcObject = null;
            dom.remoteVideo.classList.remove('active');
            dom.videoPlaceholder.style.display = 'block';

            dom.transferList.innerHTML = '';
            dom.emptyHistory.style.display = 'block';

            switchScreen('setup');
        }

        async function toggleScreenShare() {
            if (!conn || !conn.open) return showToast("接続されていません", 'error');

            if (localStream) {
                // 停止
                stopLocalStream();
                if(mediaCall) mediaCall.close();
                return;
            }

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                
                // ユーザーが共有停止ボタンを押した時の処理
                localStream.getVideoTracks()[0].onended = () => {
                    stopLocalStream();
                    if(mediaCall) mediaCall.close();
                };

                mediaCall = peer.call(conn.peer, localStream);
                setupMediaCall(mediaCall);
                
                dom.btnShareScreen.innerHTML = '<i class="ph ph-stop-circle"></i> <span>共有を停止</span>';
                dom.btnShareScreen.classList.replace('bg-blue-600', 'bg-red-600');
                dom.btnShareScreen.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
                
                dom.videoPlaceholder.style.display = 'none';
                dom.localShareIndicator.classList.remove('hidden');

            } catch (err) {
                console.error("Screen share error:", err);
                showToast("画面共有がキャンセルされたか、許可されませんでした", 'error');
            }
        }

        function stopLocalStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            dom.btnShareScreen.innerHTML = '<i class="ph ph-screencast"></i> <span>画面を共有する</span>';
            dom.btnShareScreen.classList.replace('bg-red-600', 'bg-blue-600');
            dom.btnShareScreen.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
            dom.localShareIndicator.classList.add('hidden');
            if (!dom.remoteVideo.srcObject) dom.videoPlaceholder.style.display = 'block';
        }

        function setupMediaCall(call) {
            mediaCall = call;
            call.on('stream', (remoteStream) => {
                // 相手の画面を受信
                dom.videoPlaceholder.style.display = 'none';
                dom.remoteVideo.srcObject = remoteStream;
                dom.remoteVideo.classList.add('active');
            });
            call.on('close', () => {
                dom.remoteVideo.srcObject = null;
                dom.remoteVideo.classList.remove('active');
                if(!localStream) dom.videoPlaceholder.style.display = 'block';
            });
        }

        function handleIncomingData(data) {
            // データの種類を判定
            if (data.type === 'file-offer') {
                // 相手から送信リクエストが来た
                createOfferUI(data.fileId, data.filename, data.size);
            } 
            else if (data.type === 'file-answer') {
                // 相手がリクエストを回答した
                const { fileId, accepted } = data;
                if (accepted) {
                    startFileTransmission(fileId);
                } else {
                    updateTransferStatus(fileId, '拒否されました', 'text-red-400');
                    delete pendingOutboundFiles[fileId];
                }
            }
            else if (data.type === 'file-data') {
                // チャンクデータの受信
                const { fileId, chunk } = data;
                if (activeInboundFiles[fileId]) {
                    activeInboundFiles[fileId].buffers.push(chunk);
                    activeInboundFiles[fileId].received += chunk.byteLength;
                    updateProgressUI(fileId, activeInboundFiles[fileId].received, activeInboundFiles[fileId].size);
                }
            }
            else if (data.type === 'file-eof') {
                // 送信完了
                const { fileId, filename, mime } = data;
                if (activeInboundFiles[fileId]) {
                    const blob = new Blob(activeInboundFiles[fileId].buffers, { type: mime });
                    completeReceiveUI(fileId, blob, filename);
                    delete activeInboundFiles[fileId];
                }
            }
        }

        // 送信ステップ1: リクエストを送る
        function initiateFileSend(file) {
            if (!conn || !conn.open) return showToast("接続されていません", 'error');

            const fileId = 'tx-' + Date.now() + '-' + Math.floor(Math.random()*1000);
            pendingOutboundFiles[fileId] = file;

            // 送信側のUIを作成（待機状態）
            createTransferUI(fileId, file.name, file.size, true);
            updateTransferStatus(fileId, '相手の承認を待機中...', 'text-yellow-400');

            // オファーを送信
            conn.send({
                type: 'file-offer',
                fileId: fileId,
                filename: file.name,
                size: file.size,
                mime: file.type || 'application/octet-stream'
            });
        }

        // 受信ステップ1: リクエストのUIを表示する
        function createOfferUI(fileId, filename, size) {
            dom.emptyHistory.style.display = 'none';

            const item = document.createElement('div');
            item.id = `item-${fileId}`;
            item.className = 'bg-slate-800 border border-blue-500/30 rounded-xl p-4 flex flex-col shadow-lg animate-pulse';
            
            item.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center flex-shrink-0">
                            <i class="ph-fill ph-bell-ringing text-xl text-blue-400"></i>
                        </div>
                        <div class="min-w-0">
                            <h4 class="text-sm font-semibold text-slate-100 truncate">ファイル受信リクエスト</h4>
                            <p class="text-xs text-slate-400 truncate">${filename} (${formatBytes(size)})</p>
                        </div>
                    </div>
                </div>
                <div class="flex space-x-2 mt-1">
                    <button onclick="respondToOffer('${fileId}', true, '${filename}', ${size})" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-1.5 rounded-lg text-xs font-semibold transition-colors">受け取る</button>
                    <button onclick="respondToOffer('${fileId}', false, '', 0)" class="flex-1 bg-slate-700 hover:bg-red-500/20 hover:text-red-400 text-slate-300 py-1.5 rounded-lg text-xs font-semibold transition-colors">拒否</button>
                </div>
            `;
            dom.transferList.prepend(item);
        }

        // 受信ステップ2: リクエストに回答する
        window.respondToOffer = (fileId, accepted, filename, size) => {
            const item = document.getElementById(`item-${fileId}`);
            if(item) item.remove();

            conn.send({
                type: 'file-answer',
                fileId: fileId,
                accepted: accepted
            });

            if (accepted) {
                // 受信準備
                activeInboundFiles[fileId] = { buffers: [], size: size, received: 0 };
                createTransferUI(fileId, filename, size, false);
                updateTransferStatus(fileId, '受信中 (0%)', 'text-purple-400');
            } else {
                showToast("ファイルの受信を拒否しました");
                checkEmptyList();
            }
        };

        // 送信ステップ2: 承認されたらデータをチャンクで送る
        async function startFileTransmission(fileId) {
            const file = pendingOutboundFiles[fileId];
            if (!file) return;

            updateTransferStatus(fileId, '送信中 (0%)', 'text-blue-400');

            try {
                let offset = 0;
                while (offset < file.size) {
                    if (!conn || !conn.open) throw new Error("Connection closed");
                    
                    // Backpressure control
                    while (conn.dataChannel && conn.dataChannel.bufferedAmount > MAX_BUFFER) {
                        await new Promise(r => setTimeout(r, 50));
                    }

                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    const buffer = await slice.arrayBuffer();
                    
                    // JSオブジェクトとしてラップして送信（PeerJSがシリアライズを処理）
                    conn.send({
                        type: 'file-data',
                        fileId: fileId,
                        chunk: buffer
                    });
                    
                    offset += buffer.byteLength;
                    if (offset % (CHUNK_SIZE * 5) === 0 || offset >= file.size) {
                        updateProgressUI(fileId, offset, file.size);
                    }
                }

                // EOF送信
                conn.send({
                    type: 'file-eof',
                    fileId: fileId,
                    filename: file.name,
                    mime: file.type || 'application/octet-stream'
                });

                completeSendUI(fileId);
                delete pendingOutboundFiles[fileId];

            } catch (err) {
                console.error("Send error:", err);
                updateTransferStatus(fileId, 'エラーが発生しました', 'text-red-400');
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function createTransferUI(id, filename, filesize, isSending) {
            dom.emptyHistory.style.display = 'none';
            const iconClass = isSending ? 'ph-arrow-up-right text-blue-400' : 'ph-arrow-down-left text-purple-400';
            const bgClass = isSending ? 'bg-blue-500/10' : 'bg-purple-500/10';

            const item = document.createElement('div');
            item.id = `item-${id}`;
            item.className = 'bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col shadow-sm transition-all';
            item.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-lg ${bgClass} flex items-center justify-center flex-shrink-0">
                            <i class="ph ${iconClass} text-lg"></i>
                        </div>
                        <div class="min-w-0">
                            <h4 class="text-sm font-semibold text-slate-200 truncate" title="${filename}">${filename}</h4>
                            <div class="flex items-center text-[10px] text-slate-500 font-mono space-x-2">
                                <span>${formatBytes(filesize)}</span>
                                <span>•</span>
                                <span id="status-${id}">準備中...</span>
                            </div>
                        </div>
                    </div>
                    <div id="action-${id}" class="flex-shrink-0 ml-2">
                        <i class="ph ph-spinner animate-spin text-slate-500"></i>
                    </div>
                </div>
                <div id="bar-container-${id}" class="w-full h-1 bg-slate-800 rounded-full overflow-hidden">
                    <div id="bar-${id}" class="h-full bg-gradient-to-r ${isSending ? 'from-blue-600 to-blue-400' : 'from-purple-600 to-purple-400'} w-0 transition-all duration-200"></div>
                </div>
            `;
            // Remove pulse animation if it was an offer card replaced
            item.classList.remove('animate-pulse');
            dom.transferList.prepend(item);
        }

        function updateTransferStatus(id, text, colorClass) {
            const status = document.getElementById(`status-${id}`);
            if (status) {
                status.textContent = text;
                status.className = colorClass;
            }
            if(text.includes('拒否')) {
                const action = document.getElementById(`action-${id}`);
                const bar = document.getElementById(`bar-container-${id}`);
                if(action) action.innerHTML = '<i class="ph-fill ph-x-circle text-red-500 text-lg"></i>';
                if(bar) bar.style.display = 'none';
            }
        }

        function updateProgressUI(id, current, total) {
            const bar = document.getElementById(`bar-${id}`);
            const status = document.getElementById(`status-${id}`);
            if (!bar || !status) return;
            const percent = Math.min(100, Math.round((current / total) * 100));
            bar.style.width = `${percent}%`;
            
            // Extract current action word based on color to keep it simple
            const isSending = status.className.includes('blue');
            status.textContent = `${isSending ? '送信中' : '受信中'} (${percent}%)`;
        }

        function completeSendUI(id) {
            updateTransferStatus(id, '送信完了', 'text-green-400');
            const bar = document.getElementById(`bar-container-${id}`);
            const action = document.getElementById(`action-${id}`);
            if(bar) bar.style.display = 'none';
            if(action) action.innerHTML = '<i class="ph-fill ph-check-circle text-green-500 text-lg"></i>';
            showToast("送信が完了しました", 'success');
        }

        function completeReceiveUI(id, blob, filename) {
            updateTransferStatus(id, '受信完了', 'text-green-400');
            const bar = document.getElementById(`bar-container-${id}`);
            const action = document.getElementById(`action-${id}`);
            if(bar) bar.style.display = 'none';
            
            if(action) {
                const url = URL.createObjectURL(blob);
                action.innerHTML = `
                    <a href="${url}" download="${filename}" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded text-xs font-semibold flex items-center space-x-1 transition-colors">
                        <i class="ph ph-download-simple"></i><span>保存</span>
                    </a>
                `;
                // Auto trigger download for convenience
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }
            showToast(`${filename} を受信しました`, 'success');
        }

        function checkEmptyList() {
            if(dom.transferList.children.length === 0) {
                dom.emptyHistory.style.display = 'block';
            }
        }

        // File Input Event Listeners
        dom.dropZone.addEventListener('click', () => dom.fileInput.click());
        dom.fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(initiateFileSend);
            dom.fileInput.value = '';
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
            dom.dropZone.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); }, false);
        });
        ['dragenter', 'dragover'].forEach(e => dom.dropZone.addEventListener(e, () => dom.dropZone.classList.add('drag-over'), false));
        ['dragleave', 'drop'].forEach(e => dom.dropZone.addEventListener(e, () => dom.dropZone.classList.remove('drag-over'), false));
        
        dom.dropZone.addEventListener('drop', (e) => {
            Array.from(e.dataTransfer.files).forEach(initiateFileSend);
        }, false);

        // Start App
        window.onload = initPeer;

    </script>
</body>
</html>
